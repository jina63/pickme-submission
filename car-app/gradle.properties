# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE will override settings specified here.
# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# AndroidX package structure is enabled.
android.useAndroidX=true
# Kotlin code style: official.
kotlin.code.style=official
# Use non-transitive R classes.
android.nonTransitiveRClass=true
# Keep builds working from this non-ASCII project path and avoid the Kotlin daemon cache issue.
android.overridePathCheck=true
kotlin.compiler.execution.strategy=in-process
