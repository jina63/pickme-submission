<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>픽미 · 친구 선택</title><link rel="stylesheet" href="/styles.css"><script src="/driver.js" defer></script></head>
<body><main class="phone"><a class="brand" href="/"><span class="brand-mark" aria-hidden="true">p</span><span class="brand-name">pickme</span><span class="tagline">가는 길에 함께</span></a><p class="eyebrow">함께 가면 더 좋은 길</p><h1>누구를<br>태우러 갈까요?</h1><p class="intro">정차 중 연락처에서 친구를 선택하세요.</p><form id="form" class="card"><div class="card-top"><h2>친구 찾기</h2><span class="badge">시연 연락처</span></div><p class="hint">실제 전화번호부 연결 전의 시연용 목록이에요.</p><label>이름으로 검색<input id="search" type="search" placeholder="예: 친구 2" autocomplete="off" maxlength="120"></label><fieldset id="contacts"><legend class="sr-only">초대할 친구 선택</legend></fieldset><p id="selection" role="status">친구를 선택해 주세요.</p><button id="create" class="primary" disabled>초대 링크 만들기</button><p class="hint">친구가 웹에서 탑승 장소를 선택하고 확정해요.</p></form><section class="card" id="result" hidden><div class="card-top"><h2>친구 응답</h2><span id="status" class="badge">수락 대기</span></div><p id="summary"></p><a id="invite" target="_blank" rel="noopener" class="link-button">친구 화면 열기 ↗</a><button class="secondary" id="copy">초대 링크 복사</button><p class="hint">현재는 링크를 직접 전달하는 시험 단계예요.<br>문자·카톡 자동 발송은 연결 전이에요.</p><button class="secondary" id="new">다른 친구 선택</button></section><p id="message" role="status" aria-live="polite"></p><p class="footnote">로컬 개발 버전 · 주행 상태 감지는 연결 전입니다.<br>서버를 다시 시작하면 초대 데이터가 초기화돼요.</p></main></body></html>
